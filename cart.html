<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="yacht-icon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Sea Chest | The Quarterdeck Shop</title>
    <style>
        :root {
            --gold: #d4af37;
            --ocean-blue: #0077be;
            --cream: #fdf5e6;
            --navy: #001f3f;
            --sunset-orange: #ff8c00;
            --yacht-white: #ffffff;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--cream);
            color: var(--navy);
            line-height: 1.6;
        }

        /* Typography - Matched to Merch Page */
        h1, h2, h3 { font-family: 'Georgia', serif; text-transform: uppercase; letter-spacing: 2px; }

        header {
            background: linear-gradient(rgba(0,31,63,0.6), rgba(0,31,63,0.6)), url('header-bg.jpg') center/cover;
            color: white;
            text-align: center;
            padding: 80px 20px;
            border-bottom: 8px solid var(--gold);
        }

        h1 { font-size: 3.5rem; margin: 0; text-shadow: 3px 3px var(--sunset-orange); }

        /* Navigation - Matched to Merch Page */
        nav {
            background: var(--navy);
            padding: 15px;
            position: sticky;
            top: 0;
            z-index: 1000;
            text-align: center;
            border-bottom: 2px solid var(--gold);
        }

        nav a { color: white; text-decoration: none; margin: 0 15px; font-weight: bold; font-size: 0.9rem; transition: 0.3s; }
        nav a:hover { color: var(--sunset-orange); }

        /* Cart Specific Styling */
        .container { 
            max-width: 800px; 
            margin: 40px auto; 
            padding: 40px 20px; 
            background: white; 
            border-radius: 4px; 
            border-bottom: 5px solid var(--gold);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
        }
        
        .cart-item { display: flex; align-items: center; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid #eee; }
        .cart-item img { width: 80px; height: 80px; object-fit: cover; border-radius: 4px; border: 1px solid #ddd; }
        .item-details { flex-grow: 1; margin-left: 20px; }
        .item-details strong { font-family: 'Georgia', serif; text-transform: uppercase; color: var(--navy); }
        
        .remove-btn { color: #cc0000; cursor: pointer; font-size: 0.8rem; text-decoration: underline; border: none; background: none; font-weight: bold; }
        .total-section { text-align: right; margin-top: 30px; font-size: 1.8rem; font-weight: bold; color: var(--ocean-blue); font-family: 'Georgia', serif; }
        
        .checkout-btn { 
            display: block; width: 100%; padding: 15px; background: var(--sunset-orange); 
            color: white; border: none; border-radius: 50px; font-size: 1.2rem; 
            font-weight: bold; cursor: pointer; margin-top: 20px; transition: 0.3s;
            box-shadow: 0 4px 0 #b36200;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .checkout-btn:hover { background: #e67e00; transform: translateY(2px); box-shadow: 0 2px 0 #b36200; }
        
        .empty-msg { text-align: center; padding: 40px; }

        footer { background: var(--navy); color: white; text-align: center; padding: 60px 20px; margin-top: 80px; }
    </style>
</head>
<body>

<header>
    <h1>Your Sea Chest</h1>
    <p style="font-style: italic; font-size: 1.4rem; color: var(--yacht-white);">Review your cargo before setting sail</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="shows.html">Tour</a>
    <a href="index.html#members">The Crew</a>
    <a href="Merch_page.html">Back to Shop</a>
</nav>

<div class="container">
    <div id="cart-items">
        </div>

    <div id="cart-summary" style="display:none;">
        <div class="total-section">
            Total: $<span id="total-price">0.00</span>
        </div>
        <button class="checkout-btn" onclick="checkout()">PROCEED TO CHECKOUT</button>
        <button onclick="clearCart()" style="margin-top:20px; background:none; border:none; color:gray; cursor:pointer; text-decoration: underline; display: block; width: 100%;">Empty Chest</button>
    </div>

    <div id="empty-cart" class="empty-msg">
        <h2 style="color: var(--navy);">Your chest is empty!</h2>
        <p>Head back to the Quartermaster to gather some booty.</p>
        <a href="Merch_page.html" class="checkout-btn" style="text-decoration:none; display:inline-block; width:auto; padding: 12px 30px;">Return to Shop</a>
    </div>
</div>

<footer>
    <p>&copy; 2026 Diamond Rock Monument Productions</p>
    <p>Secure Payments via Maritime Express</p>
    <div style="margin-top:20px; font-size: 2rem;">⚓ 💎 🎷</div>
</footer>

<script>
    function renderCart() {
        const cart = JSON.parse(localStorage.getItem('deckShopCart')) || [];
        const container = document.getElementById('cart-items');
        const summary = document.getElementById('cart-summary');
        const emptyMsg = document.getElementById('empty-cart');
        const totalSpan = document.getElementById('total-price');

        if (cart.length === 0) {
            container.innerHTML = '';
            summary.style.display = 'none';
            emptyMsg.style.display = 'block';
            return;
        }

        emptyMsg.style.display = 'none';
        summary.style.display = 'block';
        container.innerHTML = '';

        let total = 0;

        cart.forEach((item, index) => {
            total += item.price;
            container.innerHTML += `
                <div class="cart-item">
                    <img src="${item.image}" alt="${item.name}">
                    <div class="item-details">
                        <strong>${item.name}</strong><br>
                        <span style="color: var(--ocean-blue); font-weight: bold;">$${item.price.toFixed(2)}</span>
                    </div>
                    <button class="remove-btn" onclick="removeItem(${index})">Remove</button>
                </div>
            `;
        });

        totalSpan.innerText = total.toFixed(2);
    }

    function removeItem(index) {
        let cart = JSON.parse(localStorage.getItem('deckShopCart')) || [];
        cart.splice(index, 1);
        localStorage.setItem('deckShopCart', JSON.stringify(cart));
        renderCart();
    }

    function clearCart() {
        if(confirm("Are you sure you want to clear your sea chest?")) {
            localStorage.removeItem('deckShopCart');
            renderCart();
        }
    }

    function checkout() {
        alert("There has been an error with the payment processing system.\n\nPlease contact the store administrator at:\nmanagement@diamondrockmonument.band.");
    }

    // Initial render
    renderCart();
</script>

</body>
</html>
